<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg-grad-camp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1c" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>
    <linearGradient id="cyan-blue-grad-c" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <filter id="glow-camp" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1280" height="720" fill="url(#bg-grad-camp)" />

  <!-- Subtle Cyan Grid -->
  <g opacity="0.05" stroke="#00f2fe" stroke-width="1">
    <path d="M 0,90 L 1280,90 M 0,180 L 1280,180 M 0,270 L 1280,270 M 0,360 L 1280,360 M 0,450 L 1280,450 M 0,540 L 1280,540 M 0,630 L 1280,630" />
    <path d="M 160,0 L 160,720 M 320,0 L 320,720 M 480,0 L 480,720 M 640,0 L 640,720 M 800,0 L 800,720 M 960,0 L 960,720 M 1120,0 L 1120,720" />
  </g>

  <!-- Navigation / Header -->
  <rect x="40" y="40" width="1200" height="64" rx="14" fill="#131b2e" stroke="rgba(0, 242, 254, 0.25)" stroke-width="1.5" />
  <circle cx="75" cy="72" r="14" fill="url(#cyan-blue-grad-c)" />
  <text x="75" y="77" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="bold" fill="#070a13" text-anchor="middle">UW</text>
  <text x="105" y="77" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700" fill="#f8fafc">Campus Department &amp; Resource Hub</text>
  
  <rect x="940" y="54" width="130" height="36" rx="18" fill="rgba(0, 242, 254, 0.12)" stroke="rgba(0, 242, 254, 0.4)" stroke-width="1" />
  <circle cx="958" cy="72" r="4" fill="#00f2fe" filter="url(#glow-camp)" />
  <text x="972" y="77" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#00f2fe">SEMESTER II</text>
  
  <rect x="1090" y="54" width="130" height="36" rx="18" fill="#1b243b" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
  <text x="1155" y="77" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8" text-anchor="middle">Industrial IT Dept</text>

  <!-- Left Sidebar / Category Filter Mockup -->
  <g transform="translate(40, 130)">
    <rect width="280" height="550" rx="16" fill="#10182b" stroke="rgba(0, 242, 254, 0.2)" stroke-width="1.5" />
    <text x="24" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Portal Navigation</text>
    
    <!-- Nav Items -->
    <rect x="16" y="60" width="248" height="42" rx="8" fill="rgba(0, 242, 254, 0.15)" stroke="rgba(0, 242, 254, 0.4)" />
    <text x="36" y="86" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#00f2fe">📅 Department Schedules</text>

    <rect x="16" y="112" width="248" height="42" rx="8" fill="#162035" />
    <text x="36" y="138" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500" fill="#94a3b8">🔬 Lab &amp; Room Allocations</text>

    <rect x="16" y="164" width="248" height="42" rx="8" fill="#162035" />
    <text x="36" y="190" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500" fill="#94a3b8">📚 Courseware &amp; Repositories</text>

    <rect x="16" y="216" width="248" height="42" rx="8" fill="#162035" />
    <text x="36" y="242" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500" fill="#94a3b8">📢 Faculty Announcements</text>

    <!-- Quick Stats Box -->
    <rect x="16" y="380" width="248" height="150" rx="12" fill="#151e33" stroke="rgba(255,255,255,0.06)" />
    <text x="30" y="410" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b">ACTIVE SESSIONS</text>
    <text x="30" y="440" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="bold" fill="#f8fafc">18 Halls</text>
    <text x="30" y="468" font-family="'JetBrains Mono', monospace" font-size="11" fill="#00f2fe">424 Students Logged In</text>
    <rect x="30" y="490" width="220" height="4" rx="2" fill="#222e48" />
    <rect x="30" y="490" width="170" height="4" rx="2" fill="url(#cyan-blue-grad-c)" />
  </g>

  <!-- Right Main Schedule & Booking Board -->
  <g transform="translate(345, 130)">
    <!-- Top timetable bar -->
    <rect width="895" height="130" rx="16" fill="#10182b" stroke="rgba(0, 242, 254, 0.2)" stroke-width="1.5" />
    <text x="32" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Today's Lecture &amp; Lab Roster</text>
    <text x="32" y="62" font-family="'JetBrains Mono', monospace" font-size="12" fill="#64748b">Thursday • Industrial Information Technology (Level 300)</text>

    <!-- Day Pills -->
    <g transform="translate(32, 80)">
      <rect x="0" y="0" width="90" height="32" rx="6" fill="#162035" />
      <text x="45" y="21" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8" text-anchor="middle">Mon</text>

      <rect x="100" y="0" width="90" height="32" rx="6" fill="#162035" />
      <text x="145" y="21" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8" text-anchor="middle">Tue</text>

      <rect x="200" y="0" width="90" height="32" rx="6" fill="#162035" />
      <text x="245" y="21" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8" text-anchor="middle">Wed</text>

      <rect x="300" y="0" width="110" height="32" rx="6" fill="url(#cyan-blue-grad-c)" />
      <text x="355" y="21" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#070a13" text-anchor="middle">Thu (Today)</text>

      <rect x="420" y="0" width="90" height="32" rx="6" fill="#162035" />
      <text x="465" y="21" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8" text-anchor="middle">Fri</text>
    </g>

    <!-- Interactive Schedule Cards -->
    <g transform="translate(0, 155)">
      <!-- Session Card 1 -->
      <rect x="0" y="0" width="895" height="115" rx="14" fill="#10182b" stroke="rgba(0, 242, 254, 0.3)" stroke-width="1.5" filter="url(#glow-camp)" />
      <rect x="24" y="22" width="100" height="32" rx="6" fill="rgba(0, 242, 254, 0.15)" stroke="#00f2fe" stroke-width="1" />
      <text x="74" y="42" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#00f2fe" text-anchor="middle">09:00 - 11:00</text>
      
      <text x="145" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Software Engineering &amp; System Architecture (IIT-312)</text>
      <text x="145" y="68" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">Lecture Hall: LT-02 • Prof. K. Perera</text>
      <text x="145" y="92" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#64748b">Topic: Microservices Architecture, API Gateway patterns &amp; Circuit Breakers</text>
      
      <rect x="740" y="38" width="120" height="36" rx="18" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.4)" />
      <text x="800" y="60" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#10b981" text-anchor="middle">IN PROGRESS</text>

      <!-- Session Card 2 -->
      <rect x="0" y="135" width="895" height="115" rx="14" fill="#10182b" stroke="rgba(148, 163, 184, 0.15)" stroke-width="1.5" />
      <rect x="24" y="157" width="100" height="32" rx="6" fill="#162035" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <text x="74" y="177" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#94a3b8" text-anchor="middle">11:30 - 13:30</text>
      
      <text x="145" y="177" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Quality Assurance &amp; Automated Verification Lab (IIT-316)</text>
      <text x="145" y="203" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">Computer Lab: CL-04 (Computing Complex) • Eng. Chamal L.</text>
      <text x="145" y="227" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#64748b">Practical: Automated Selenium test script execution &amp; Postman test collections</text>
      
      <rect x="740" y="173" width="120" height="36" rx="18" fill="rgba(0, 242, 254, 0.12)" stroke="rgba(0, 242, 254, 0.3)" />
      <text x="800" y="195" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#00f2fe" text-anchor="middle">UPCOMING</text>

      <!-- Session Card 3 -->
      <rect x="0" y="270" width="895" height="115" rx="14" fill="#10182b" stroke="rgba(148, 163, 184, 0.15)" stroke-width="1.5" />
      <rect x="24" y="292" width="100" height="32" rx="6" fill="#162035" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <text x="74" y="312" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#94a3b8" text-anchor="middle">14:30 - 16:30</text>
      
      <text x="145" y="312" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Industrial Control Systems &amp; Robotics (IIT-320)</text>
      <text x="145" y="338" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">Automation Lab: AL-01 • Dr. Senanayake</text>
      <text x="145" y="362" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#64748b">Workshop: PLC ladder logic interfacing with SCADA telemetry middleware</text>
      
      <rect x="740" y="308" width="120" height="36" rx="18" fill="#162035" stroke="rgba(255,255,255,0.1)" />
      <text x="800" y="330" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#64748b" text-anchor="middle">SCHEDULED</text>
    </g>
  </g>
</svg>
