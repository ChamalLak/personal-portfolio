<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg-grad-def" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#060910" />
    </linearGradient>
    <linearGradient id="cyan-blue-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <filter id="glow-def" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1280" height="720" fill="url(#bg-grad-def)" />

  <!-- Subtle Grid -->
  <g opacity="0.05" stroke="#00f2fe" stroke-width="1">
    <path d="M 0,100 L 1280,100 M 0,200 L 1280,200 M 0,300 L 1280,300 M 0,400 L 1280,400 M 0,500 L 1280,500 M 0,600 L 1280,600" />
    <path d="M 160,0 L 160,720 M 320,0 L 320,720 M 480,0 L 480,720 M 640,0 L 640,720 M 800,0 L 800,720 M 960,0 L 960,720 M 1120,0 L 1120,720" />
  </g>

  <!-- Navigation / Header -->
  <rect x="40" y="40" width="1200" height="64" rx="14" fill="#131b2e" stroke="rgba(0, 242, 254, 0.25)" stroke-width="1.5" />
  <rect x="62" y="56" width="32" height="32" rx="8" fill="url(#cyan-blue-grad)" />
  <text x="78" y="78" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold" fill="#070a13" text-anchor="middle">&lt;/&gt;</text>
  <text x="110" y="77" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700" fill="#f8fafc">QA Defect Tracker &amp; Bug Lifecycle OS</text>
  
  <rect x="910" y="54" width="150" height="36" rx="18" fill="rgba(245, 158, 11, 0.12)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1" />
  <circle cx="928" cy="72" r="4" fill="#f59e0b" />
  <text x="944" y="77" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#f59e0b">SPRINT 44 • ACTIVE</text>

  <rect x="1080" y="54" width="140" height="36" rx="18" fill="rgba(0, 242, 254, 0.12)" stroke="rgba(0, 242, 254, 0.4)" stroke-width="1" />
  <text x="1150" y="77" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#00f2fe" text-anchor="middle">98.2% COVERAGE</text>

