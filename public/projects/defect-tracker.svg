    <text x="512" y="229" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b">BUG-1077</text>
    <text x="442" y="258" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Latency regression test on /orders API</text>
    <text x="442" y="278" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">Execution latency: 48ms</text>

    <!-- Column 3: QA Sign-off / Closed -->
    <rect x="820" y="0" width="380" height="445" rx="14" fill="#10182b" stroke="rgba(16, 185, 129, 0.25)" stroke-width="1.5" />
    <text x="844" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="600" fill="#10b981">Verified &amp; Production Signed</text>
    <circle cx="1160" cy="28" r="10" fill="rgba(16, 185, 129, 0.2)" />
    <text x="1160" y="32" font-family="'JetBrains Mono', monospace" font-size="11" fill="#10b981" text-anchor="middle">5</text>

    <!-- Card 3-A -->
    <rect x="838" y="55" width="344" height="105" rx="10" fill="#162238" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1" />
    <rect x="852" y="70" width="70" height="20" rx="4" fill="rgba(16, 185, 129, 0.2)" />
    <text x="887" y="84" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#10b981" text-anchor="middle">VERIFIED</text>
    <text x="932" y="84" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b">BUG-1065</text>
    <text x="852" y="112" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Schema contract violation on POST /user</text>
    <text x="852" y="132" font-family="'JetBrains Mono', monospace" font-size="11" fill="#10b981">✓ All 12 regression tests passed</text>

    <!-- Card 3-B -->
    <rect x="838" y="170" width="344" height="105" rx="10" fill="#162238" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1" />
    <rect x="852" y="185" width="70" height="20" rx="4" fill="rgba(16, 185, 129, 0.2)" />
    <text x="887" y="199" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#10b981" text-anchor="middle">VERIFIED</text>
    <text x="932" y="199" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b">BUG-1059</text>
    <text x="852" y="227" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#f8fafc">SQL injection prevention validation</text>
    <text x="852" y="247" font-family="'JetBrains Mono', monospace" font-size="11" fill="#10b981">✓ Penetration assertions passed</text>
