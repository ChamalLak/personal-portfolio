    <!-- Card 2-A -->
    <rect x="428" y="55" width="344" height="135" rx="10" fill="#131e33" stroke="#00f2fe" stroke-width="1.5" filter="url(#glow-def)" />
    <rect x="442" y="70" width="76" height="20" rx="4" fill="rgba(0, 242, 254, 0.2)" />
    <text x="480" y="84" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#00f2fe" text-anchor="middle">CYPRESS E2E</text>
    <text x="530" y="84" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b">BUG-1084</text>
    <text x="442" y="112" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Table pagination boundary payload fix</text>
    <rect x="442" y="130" width="316" height="6" rx="3" fill="#1e293b" />
