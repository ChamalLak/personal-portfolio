    <text x="632" y="32" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">VERIFIED &amp; CLOSED</text>
    <text x="632" y="68" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="bold" fill="#00f2fe">188</text>
    <rect x="792" y="24" width="80" height="24" rx="12" fill="rgba(0, 242, 254, 0.15)" stroke="rgba(0, 242, 254, 0.3)" />
    <text x="832" y="40" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#00f2fe" text-anchor="middle">+18 TODAY</text>

