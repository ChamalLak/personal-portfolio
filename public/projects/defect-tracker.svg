  <g transform="translate(40, 125)">
    <!-- Metric 1 -->
    <rect x="0" y="0" width="280" height="90" rx="12" fill="#10182b" stroke="rgba(0, 242, 254, 0.2)" stroke-width="1.5" />
    <text x="20" y="32" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">CRITICAL DEFECTS</text>
    <text x="20" y="68" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="bold" fill="#f43f5e">0</text>
    <rect x="180" y="24" width="80" height="24" rx="12" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.3)" />
