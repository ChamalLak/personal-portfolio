    <rect x="428" y="200" width="344" height="110" rx="10" fill="#162238" stroke="rgba(148, 163, 184, 0.2)" stroke-width="1" />
    <rect x="442" y="215" width="60" height="20" rx="4" fill="rgba(56, 189, 248, 0.2)" />
